<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncSphere | Collaborative Project Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        .sidebar-gradient { background: linear-gradient(180deg, #1e40af 0%, #1d4ed8 100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans" x-data="{ 
    currentTab: 'dashboard', 
    userRole: 'Administrator',
    isLoggedIn: false,
    showRegister: false,
    showProfile: false
}">

    <!-- LOGIN PAGE (Requirement: Register/Login Use Case) -->
    <template x-if="!isLoggedIn && !showRegister">
        <div class="h-screen flex">
            <div class="hidden lg:flex w-1/2 sidebar-gradient items-center justify-center p-12 text-white">
                <div class="max-w-md">
                    <h1 class="text-5xl font-bold mb-6">SyncSphere</h1>
                    <p class="text-xl opacity-90">Revolutionizing collaborative scheduling and project management for modern teams.</p>
                    <div class="mt-12 space-y-4">
                        <div class="flex items-center gap-4"><i class="fas fa-check-circle"></i><span>Real-time Task Tracking</span></div>
                        <div class="flex items-center gap-4"><i class="fas fa-check-circle"></i><span>Team Synchronization</span></div>
                        <div class="flex items-center gap-4"><i class="fas fa-check-circle"></i><span>Advanced Analytics</span></div>
                    </div>
                </div>
            </div>
            <div class="w-full lg:w-1/2 flex items-center justify-center p-8">
                <div class="w-full max-w-sm space-y-6">
                    <div class="text-center">
                        <h2 class="text-3xl font-bold text-blue-700">Login</h2>
                        <p class="text-slate-500">Access your workspace</p>
                    </div>
                    <form @submit.prevent="isLoggedIn = true" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Email</label>
                            <input type="email" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="admin@syncsphere.com">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Password</label>
                            <input type="password" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition">Sign In</button>
                    </form>
                    <p class="text-center text-sm">Don't have an account? <a href="#" @click.prevent="showRegister = true" class="text-blue-600 font-bold">Register</a></p>
                </div>
            </div>
        </div>
    </template>


    <!-- REGISTRATION PAGE -->
    <template x-if="!isLoggedIn && showRegister">
        <div class="h-screen flex">
            <div class="hidden lg:flex w-1/2 sidebar-gradient items-center justify-center p-12 text-white">
                <div class="max-w-md">
                    <h1 class="text-5xl font-bold mb-6">SyncSphere</h1>
                    <p class="text-xl opacity-90">Create your workspace account and start collaborating with your team.</p>
                    <div class="mt-12 space-y-4">
                        <div class="flex items-center gap-4"><i class="fas fa-check-circle"></i><span>Real-time Task Tracking</span></div>
                        <div class="flex items-center gap-4"><i class="fas fa-check-circle"></i><span>Team Synchronization</span></div>
                        <div class="flex items-center gap-4"><i class="fas fa-check-circle"></i><span>Advanced Analytics</span></div>
                    </div>
                </div>
            </div>

            <div class="w-full lg:w-1/2 flex items-center justify-center p-8 overflow-y-auto">
                <div class="w-full max-w-sm space-y-5">
                    <div class="text-center">
                        <h2 class="text-3xl font-bold text-blue-700">Create Account</h2>
                        <p class="text-slate-500">Join your SyncSphere workspace</p>
                    </div>

                    <form @submit.prevent="showRegister = false" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Full Name</label>
                            <input type="text" required
                                   class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                   placeholder="Enter your full name">
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-1">Email</label>
                            <input type="email" required
                                   class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                   placeholder="you@example.com">
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-1">Password</label>
                            <input type="password" required minlength="6"
                                   class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                   placeholder="Create a password">
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-1">Confirm Password</label>
                            <input type="password" required minlength="6"
                                   class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                   placeholder="Confirm your password">
                        </div>

                        <button type="submit"
                                class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                            Create Account
                        </button>
                    </form>

                    <p class="text-center text-sm">
                        Already have an account?
                        <a href="#" @click.prevent="showRegister = false" class="text-blue-600 font-bold">Back to Login</a>
                    </p>
                </div>
            </div>
        </div>
    </template>

    <!-- MAIN APPLICATION (The "Shell") -->
    <template x-if="isLoggedIn">
        <div class="flex h-screen overflow-hidden">
            
            <!-- SIDEBAR -->
            <aside class="w-64 sidebar-gradient text-white flex flex-col shrink-0">
                <div class="p-6 text-2xl font-bold flex items-center gap-3">
                    <i class="fas fa-layer-group text-blue-300"></i>
                    SyncSphere
                </div>
                
                <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                    <div class="text-xs uppercase text-blue-300 font-bold px-2 mb-2">Main Menu</div>
                    <button @click="currentTab = 'dashboard'" :class="currentTab === 'dashboard' ? 'bg-blue-800' : 'hover:bg-blue-600'" class="w-full flex items-center gap-3 p-3 rounded-lg transition">
                        <i class="fas fa-home w-5"></i> Dashboard
                    </button>
                    <button @click="currentTab = 'tasks'" :class="currentTab === 'tasks' ? 'bg-blue-800' : 'hover:bg-blue-600'" class="w-full flex items-center gap-3 p-3 rounded-lg transition">
                        <i class="fas fa-tasks w-5"></i> Manage Tasks
                    </button>
                    <button @click="currentTab = 'calendar'" :class="currentTab === 'calendar' ? 'bg-blue-800' : 'hover:bg-blue-600'" class="w-full flex items-center gap-3 p-3 rounded-lg transition">
                        <i class="fas fa-calendar-alt w-5"></i> Shared Calendar
                    </button>
                    <button @click="currentTab = 'discussions'" :class="currentTab === 'discussions' ? 'bg-blue-800' : 'hover:bg-blue-600'" class="w-full flex items-center gap-3 p-3 rounded-lg transition">
                        <i class="fas fa-comments w-5"></i> Discussions
                    </button>
                    
                    <div class="text-xs uppercase text-blue-300 font-bold px-2 mt-6 mb-2">Management</div>
                    <button @click="currentTab = 'teams'" :class="currentTab === 'teams' ? 'bg-blue-800' : 'hover:bg-blue-600'" class="w-full flex items-center gap-3 p-3 rounded-lg transition">
                        <i class="fas fa-users w-5"></i> Team Management
                    </button>
                    <button @click="currentTab = 'reports'" :class="currentTab === 'reports' ? 'bg-blue-800' : 'hover:bg-blue-600'" class="w-full flex items-center gap-3 p-3 rounded-lg transition">
                        <i class="fas fa-chart-line w-5"></i> System Reports
                    </button>
                    
                    <div x-show="userRole === 'Administrator'" class="text-xs uppercase text-blue-300 font-bold px-2 mt-6 mb-2">Admin Only</div>
                    <button x-show="userRole === 'Administrator'" @click="currentTab = 'admin'" :class="currentTab === 'admin' ? 'bg-blue-800' : 'hover:bg-blue-600'" class="w-full flex items-center gap-3 p-3 rounded-lg transition">
                        <i class="fas fa-shield-alt w-5"></i> Admin Control
                    </button>
                </nav>

                <div class="p-4 border-t border-blue-600">
                    <button @click="isLoggedIn = false" class="w-full flex items-center gap-3 p-3 rounded-lg hover:bg-red-600 transition">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </aside>

            <!-- CONTENT AREA -->
            <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
                <!-- Header -->
                <header class="h-16 bg-white border-b flex items-center justify-between px-8 shrink-0">
                    <h2 class="text-xl font-bold text-slate-700 capitalize" x-text="currentTab.replace('-', ' ')"></h2>
                    <div class="flex items-center gap-6">
                        <div class="relative">
                            <i class="fas fa-bell text-slate-400 cursor-pointer"></i>
                            <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                        </div>
                        <div class="flex items-center gap-3 border-l pl-6 cursor-pointer" @click="currentTab = 'profile'">
                            <div class="text-right hidden sm:block">
                                <div class="text-sm font-bold leading-tight">Alex Johnson</div>
                                <div class="text-xs text-slate-500 font-medium" x-text="userRole"></div>
                            </div>
                            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold">AJ</div>
                        </div>
                    </div>
                </header>

                <!-- Scrollable Viewport -->
                <div class="flex-1 overflow-y-auto p-8">

                    <!-- DASHBOARD VIEW -->
                    <div x-show="currentTab === 'dashboard'" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                            <div class="bg-white p-6 rounded-xl shadow-sm border">
                                <div class="text-slate-500 text-sm mb-1">Active Projects</div>
                                <div class="text-3xl font-bold">12</div>
                            </div>
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-l-4 border-l-blue-500">
                                <div class="text-slate-500 text-sm mb-1">Pending Tasks</div>
                                <div class="text-3xl font-bold text-blue-600">28</div>
                            </div>
                            <div class="bg-white p-6 rounded-xl shadow-sm border">
                                <div class="text-slate-500 text-sm mb-1">Team Efficiency</div>
                                <div class="text-3xl font-bold">94%</div>
                            </div>
                            <div class="bg-white p-6 rounded-xl shadow-sm border">
                                <div class="text-slate-500 text-sm mb-1">Upcoming Deadlines</div>
                                <div class="text-3xl font-bold text-red-500">3</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div class="bg-white p-6 rounded-xl shadow-sm border min-h-[300px]">
                                <h3 class="font-bold mb-4">Project Status Overview</h3>
                                <div class="h-48 w-full bg-slate-50 rounded flex items-center justify-center border-dashed border-2">
                                    [Interactive Chart Placeholder]
                                </div>
                            </div>
                            <div class="bg-white p-6 rounded-xl shadow-sm border">
                                <h3 class="font-bold mb-4">Recent Activity</h3>
                                <div class="space-y-4">
                                    <div class="flex gap-3 text-sm border-b pb-2">
                                        <div class="w-8 h-8 rounded-full bg-green-100 text-green-600 flex items-center justify-center"><i class="fas fa-check"></i></div>
                                        <div><strong>You</strong> completed task 'Database Backup' <div class="text-xs text-slate-400">2 hours ago</div></div>
                                    </div>
                                    <div class="flex gap-3 text-sm border-b pb-2">
                                        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center"><i class="fas fa-plus"></i></div>
                                        <div><strong>Maria</strong> added a new file to 'Phase 2' <div class="text-xs text-slate-400">4 hours ago</div></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TASKS VIEW -->
                    <div x-show="currentTab === 'tasks'" class="space-y-4">
                        <div class="flex justify-between items-center mb-6">
                            <div class="flex gap-2">
                                <button class="bg-white px-4 py-2 rounded border font-bold text-sm">All Tasks</button>
                                <button class="bg-white px-4 py-2 rounded border text-sm text-slate-500">In Progress</button>
                                <button class="bg-white px-4 py-2 rounded border text-sm text-slate-500">Completed</button>
                            </div>
                            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm"><i class="fas fa-plus mr-2"></i>New Task</button>
                        </div>
                        <table class="w-full bg-white rounded-xl shadow-sm overflow-hidden border">
                            <thead class="bg-slate-50 text-xs font-bold uppercase text-slate-500">
                                <tr>
                                    <th class="p-4 text-left">Task Name</th>
                                    <th class="p-4 text-left">Assigned To</th>
                                    <th class="p-4 text-left">Due Date</th>
                                    <th class="p-4 text-left">Priority</th>
                                    <th class="p-4 text-left">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y text-sm">
                                <tr>
                                    <td class="p-4 font-bold">API Documentation</td>
                                    <td class="p-4">John Doe</td>
                                    <td class="p-4 text-slate-500">Oct 24, 2023</td>
                                    <td class="p-4"><span class="px-2 py-1 bg-red-100 text-red-700 rounded text-xs">High</span></td>
                                    <td class="p-4"><span class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded text-xs">In Progress</span></td>
                                </tr>
                                <tr>
                                    <td class="p-4 font-bold">User Interface Polish</td>
                                    <td class="p-4">Jane Smith</td>
                                    <td class="p-4 text-slate-500">Oct 26, 2023</td>
                                    <td class="p-4"><span class="px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs">Medium</span></td>
                                    <td class="p-4"><span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs">Done</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- CALENDAR VIEW -->
                    <div x-show="currentTab === 'calendar'" class="bg-white rounded-xl border p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-bold">October 2023</h3>
                            <div class="flex gap-2">
                                <button class="p-2 hover:bg-slate-100 rounded border"><i class="fas fa-chevron-left"></i></button>
                                <button class="p-2 hover:bg-slate-100 rounded border"><i class="fas fa-chevron-right"></i></button>
                            </div>
                        </div>
                        <div class="grid grid-cols-7 gap-px bg-slate-200 border rounded overflow-hidden">
                            <template x-for="day in ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']">
                                <div class="bg-slate-50 p-2 text-center text-xs font-bold uppercase text-slate-500" x-text="day"></div>
                            </template>
                            <!-- Fake Calendar Days -->
                            <template x-for="i in 31">
                                <div class="bg-white h-24 p-2 text-xs border relative group hover:bg-blue-50 cursor-pointer">
                                    <span x-text="i" class="font-bold"></span>
                                    <div x-show="i == 15" class="mt-1 p-1 bg-blue-100 text-blue-700 rounded text-[10px] truncate">Team Meeting</div>
                                    <div x-show="i == 22" class="mt-1 p-1 bg-red-100 text-red-700 rounded text-[10px] truncate">Project Deadline</div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- ADMIN VIEW -->
                    <div x-show="currentTab === 'admin'" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="bg-white p-6 rounded-xl border shadow-sm">
                                <h3 class="font-bold mb-4 text-red-600"><i class="fas fa-database mr-2"></i>System Backup & Restore</h3>
                                <p class="text-sm text-slate-500 mb-6">Create a full snapshot of the SyncSphere database for recovery.</p>
                                <div class="flex gap-3">
                                    <button class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold">Run Backup Now</button>
                                    <button class="border border-slate-300 px-4 py-2 rounded-lg text-sm font-bold">View History</button>
                                </div>
                            </div>
                            <div class="bg-white p-6 rounded-xl border shadow-sm">
                                <h3 class="font-bold mb-4 text-blue-600"><i class="fas fa-user-cog mr-2"></i>Global Settings</h3>
                                <div class="space-y-4">
                                    <div class="flex items-center justify-between">
                                        <span class="text-sm">Allow Self-Registration</span>
                                        <div class="w-10 h-5 bg-green-500 rounded-full flex items-center justify-end px-1"><div class="w-3 h-3 bg-white rounded-full"></div></div>
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <span class="text-sm">Email Notifications</span>
                                        <div class="w-10 h-5 bg-green-500 rounded-full flex items-center justify-end px-1"><div class="w-3 h-3 bg-white rounded-full"></div></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl border">
                            <h3 class="font-bold mb-4">System Audit Logs</h3>
                            <div class="text-xs font-mono text-slate-500 space-y-2">
                                <div>[2023-10-20 14:22] - User Admin changed system settings.</div>
                                <div>[2023-10-20 12:05] - Automated Database Backup Successful.</div>
                                <div>[2023-10-19 09:15] - New User 'TeamMember_5' registered.</div>
                            </div>
                        </div>
                    </div>

                    <!-- PROFILE PAGE VIEW -->
                    <div x-show="currentTab === 'profile'" class="max-w-2xl mx-auto bg-white rounded-xl border overflow-hidden shadow-lg">
                        <div class="h-32 bg-blue-600"></div>
                        <div class="px-8 pb-8">
                            <div class="relative -mt-12 mb-6 flex justify-between items-end">
                                <div class="w-24 h-24 rounded-full bg-slate-200 border-4 border-white flex items-center justify-center text-4xl font-bold text-blue-700">AJ</div>
                                <button class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold text-sm">Edit Profile</button>
                            </div>
                            <div class="space-y-6">
                                <div>
                                    <h2 class="text-2xl font-bold">Alex Johnson</h2>
                                    <p class="text-slate-500">Project Architect & Administrator</p>
                                </div>
                                <div class="grid grid-cols-2 gap-6 pt-6 border-t">
                                    <div>
                                        <label class="text-xs font-bold text-slate-400 uppercase">Email Address</label>
                                        <div class="font-medium">admin@syncsphere.com</div>
                                    </div>
                                    <div>
                                        <label class="text-xs font-bold text-slate-400 uppercase">Team</label>
                                        <div class="font-medium">Core Infrastructure</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Placeholder for missing tabs -->
                    <div x-show="['discussions', 'teams', 'reports'].includes(currentTab)" class="h-full flex flex-col items-center justify-center text-center">
                        <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4 text-slate-300">
                            <i class="fas fa-tools text-3xl"></i>
                        </div>
                        <h2 class="text-xl font-bold">Interface Under Construction</h2>
                        <p class="text-slate-500 max-w-sm">The <span class="font-bold capitalize" x-text="currentTab"></span> view from Image 2 is mapped to this route. Backend data connection required.</p>
                    </div>

                </div>
            </main>
        </div>
    </template>

</body>
</html>
